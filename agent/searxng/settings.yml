# Minimal SearXNG settings for the agent's web_search tool.
#
# IMPORTANT: set a unique secret below before first start:
#   sed -i "s/CHANGE_ME_RANDOM_SECRET/$(openssl rand -hex 32)/" settings.yml
#
# The one setting that matters for the tool is search.formats including "json" -
# SearXNG disables the JSON API by default, and web_search needs it (a 403 from
# web_search almost always means this is missing).
use_default_settings: true

general:
  instance_name: "lab-search"

server:
  secret_key: "CHANGE_ME_RANDOM_SECRET"
  limiter: false          # no bot-limiter: the only client is the local agent
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json                # <-- required for web_search

# The 3 s default is too tight: the first query after a (re)start opens fresh
# connections to every engine and times out across the board otherwise.
outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0

# Spread queries over several engines so one that CAPTCHAs or rate-limits you
# (DuckDuckGo and Brave both do under repeated testing) doesn't leave you with
# nothing. "google cse" is a default engine that needs its own setup and only
# times out, so it is turned off.
engines:
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
  - name: wikipedia
    disabled: false
  - name: google cse
    disabled: true
